<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spreadsheet UI — Gaudy Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #ECE7D5; font-family: 'Patrick Hand', cursive; }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas
      title="Spreadsheet UI — gaudy &amp; bright"
      subtitle="5 wireframe takes for the post-meeting automation workflow. Drag to reorder · double-click any artboard to focus."
    >
      <DCSection id="grids" title="Spreadsheet wireframes">
        <DCArtboard id="opt-1" label="1 · Highlighter marker"   width={1080} height={760}>
          <HighlighterGrid />
        </DCArtboard>
        <DCArtboard id="opt-2" label="2 · Memphis color blocks" width={1080} height={760}>
          <ColorBlockRows />
        </DCArtboard>
        <DCArtboard id="opt-3" label="3 · Sticky-note board"    width={1080} height={760}>
          <StickyNoteGrid />
        </DCArtboard>
        <DCArtboard id="opt-4" label="4 · Neon terminal"        width={1080} height={760}>
          <NeonTerminal />
        </DCArtboard>
        <DCArtboard id="opt-5" label="5 · Rainbow stripe sketch" width={1080} height={760}>
          <RainbowSketchy />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
